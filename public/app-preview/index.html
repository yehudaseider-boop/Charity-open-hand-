<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Givezy app preview</title>
<style>
  :root { --brand:#1749B5; --ink:#0E1B3D; --slate:#4A5878; --lilac:#F4F1FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--ink); background: #fff; }
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 32px 24px; background: radial-gradient(60rem 40rem at 85% 10%, #FFEBDD 0, transparent 60%), radial-gradient(50rem 40rem at 5% 90%, var(--lilac) 0, transparent 60%), #fff; }
  .copy { max-width: 26rem; }
  .copy p.tag { display: inline-block; margin: 0 0 16px; padding: 6px 14px; border-radius: 999px; background: var(--lilac); color: var(--brand); font-weight: 700; font-size: 14px; }
  .copy h1 { margin: 0 0 14px; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; }
  .copy p { margin: 0 0 12px; font-size: 17px; line-height: 1.5; color: var(--slate); }
  .phone { flex: none; width: 414px; height: 868px; padding: 12px; border-radius: 58px; background: var(--ink); box-shadow: 0 40px 90px rgba(6,22,70,.35); }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 46px; background: #fff; display: block; }
  @media (max-width: 960px) { .stage { flex-direction: column; gap: 28px; } .copy { text-align: center; } }
  @media (max-width: 480px) { .stage { padding: 0; } .copy { display: none; } .phone { width: 100%; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; background: none; } .phone iframe { width: 100%; height: 100%; border-radius: 0; } }
</style>
</head>
<body>
<main class="stage">
  <div class="copy">
    <p class="tag">Preview</p>
    <h1>The Givezy app, in your browser.</h1>
    <p>This is the real app running with made-up charities and gifts. Tap around: it is what donors will use at launch.</p>
    <p>Nothing here is saved or charged.</p>
  </div>
  <div class="phone"><iframe id="app" title="The Givezy app, with sample data" src="/app-preview/app/"></iframe></div>
</main>
<script>
  // On a phone the app fills the screen (no frame, no pretend status bar); on a laptop it sits in an iPhone-shaped frame.
  var phone = window.matchMedia("(max-width: 480px)").matches;
  document.getElementById("app").src = "/app-preview/app/" + (phone ? "" : "?preview=iphone");
</script>
</body>
</html>
