# Runs on every push and pull request: typecheck, lint, and every test,
# including the database tests against a fresh local Supabase built from
# supabase/migrations and the test data in scripts/seed.ts.
name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # statuses: write lets the step below tell Vercel pass or fail; actions: read lets it see how the steps went.
    permissions:
      contents: read
      statuses: write
      actions: read
    steps:
      # Tells Vercel this commit's checks are running (pending), and when the job ends whether every step passed.
      # Vercel's Deployment Checks wait for this before a new version goes live (decided 22/11/2026).
      # The name must match the check name typed into Vercel, Settings, Deployment Checks.
      - name: Tell Vercel the checks are running
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: 'Vercel - charity-open-hand: checks'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install website packages
        run: npm ci --no-audit --no-fund

      # The database takes about a minute to wake up and needs nothing below, so it starts now and wakes up while
      # the typecheck and lint run (22/11/2026: saves about a minute a push). "Wait for the test database" below
      # fails the job if it didn't start.
      - name: Start the test database in the background
        run: |
          setsid bash -c 'npm run db:start > db-start.log 2>&1; echo $? > db-start.exit' > /dev/null 2>&1 < /dev/null &

      - name: Install phone app packages
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Typecheck the phone app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Lint the phone app
        working-directory: apps/mobile
        run: npx eslint src

      - name: Wait for the test database
        timeout-minutes: 8
        run: |
          until [ -f db-start.exit ]; do sleep 2; done
          cat db-start.log
          exit "$(cat db-start.exit)"

      - name: Write local settings for the seed and tests
        run: |
          npx supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "PAYMENT_GATEWAY=test"
            echo "TEST_GATEWAY_SECRET=ci-only-test-secret"
            echo "SITE_URL=http://127.0.0.1:3000"
          } > .env.local
          rm supabase.env

      - name: Load test data
        run: npm run db:seed

      - name: Tests
        run: npm test

      - name: Stop the test database
        if: always()
        run: npx supabase stop --no-backup
