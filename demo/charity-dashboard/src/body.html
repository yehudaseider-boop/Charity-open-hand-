<header class="topbar">
  <div class="topbar-inner">
    <img class="logo" src="{{logo}}" alt="Givezy" width="1200" height="396">
    <span class="sample-tag" title="Everything on these screens is made up">Sample data</span>
    <span class="topbar-spacer"></span>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <div class="demo-controls" id="demo-controls"></div>
  </div>
</header>
<div class="band">
  <img class="splash" src="{{splash}}" alt="" aria-hidden="true" width="640" height="451">
  <div class="band-inner">
    <div style="min-width:0">
      <p class="eyebrow">Givezy for charities</p>
      <p class="charity">Sample Charity</p>
    </div>
    <div class="chips"><span class="chip success">Approved</span><span class="chip">s18A receipts on</span></div>
  </div>
</div>
<div class="shell">
  <aside><nav aria-label="Charity dashboard"><div class="nav-row" id="nav-row"></div><div class="nav-side" id="nav-side"></div></nav><div id="walk-side"></div></aside>
  <main id="main"></main>
</div>
<div id="walk-slot"></div>
<div id="overlay-slot"></div>
